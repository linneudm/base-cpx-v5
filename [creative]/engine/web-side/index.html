<!doctype html>
<html lang="pt-BR">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>Fuel UI</title>
	<script src="https://cdn.tailwindcss.com"></script>
	<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
	<script>
		tailwind.config = {
			theme: {
				extend: {
					colors: {
						panel: "#0b1220",
						primary: "#22d3ee",
						accent: "#a78bfa",
						success: "#34d399",
						warn: "#f59e0b"
					},
					boxShadow: {
						glow: "0 0 40px rgba(34,211,238,.28)"
					}
				}
			}
		}
	</script>
</head>
<body class="m-0 overflow-hidden bg-transparent text-slate-100">
	<div id="fuelWrap" class="fixed inset-0 hidden">
		<div id="fuelPanel" class="absolute left-8 bottom-8 w-[380px] rounded-2xl border border-white/15 p-5 shadow-glow">
			<div class="mb-4 flex items-start justify-between">
				<div>
					<h1 id="title" class="text-sm font-semibold uppercase tracking-[0.24em] text-cyan-300">Posto de Gasolina</h1>
					<p id="legends" class="mt-1 text-[11px] uppercase tracking-[0.18em] text-slate-300/85">Abastecimento de combustível</p>
				</div>
				<div class="rounded-full border border-cyan-300/30 bg-cyan-400/10 px-3 py-1 text-[10px] font-medium uppercase tracking-widest text-cyan-200">
					ONLINE
				</div>
			</div>

			<div class="mb-4 rounded-xl border border-white/10 bg-white/5 p-3">
				<p class="text-[10px] uppercase tracking-[0.16em] text-slate-300/75">Veículo selecionado</p>
				<p id="vehicle" class="mt-1 truncate text-sm font-medium text-white">Desconhecido</p>
			</div>

			<div class="mb-4 rounded-xl border border-white/10 bg-white/5 p-2">
				<div class="vehicle-image-wrap h-24 w-full overflow-hidden rounded-lg border border-white/10">
					<img id="vehicleImage" alt="Veículo" class="h-full w-full object-cover"
						src="https://docs.fivem.net/vehicles/adder.webp" />
				</div>
			</div>

			<div class="grid grid-cols-3 gap-2">
				<div class="rounded-xl border border-cyan-300/25 bg-cyan-400/10 p-3">
					<p class="text-[10px] uppercase tracking-wider text-cyan-200/90">Tanque</p>
					<p class="mt-1 text-xl font-semibold"><span id="tank">0</span><span class="ml-1 text-sm text-cyan-100/80">%</span></p>
				</div>
				<div class="rounded-xl border border-emerald-300/25 bg-emerald-400/10 p-3">
					<p class="text-[10px] uppercase tracking-wider text-emerald-200/90">Valor</p>
					<p class="mt-1 text-xl font-semibold"><span class="text-sm align-top">$</span><span id="price">0</span></p>
				</div>
				<div class="rounded-xl border border-amber-300/25 bg-amber-400/10 p-3">
					<p class="text-[10px] uppercase tracking-wider text-amber-200/90">Litro</p>
					<p class="mt-1 text-xl font-semibold"><span id="lts">0</span><span class="ml-1 text-sm text-amber-100/80">¢</span></p>
				</div>
			</div>
		</div>
	</div>

	<link rel="stylesheet" href="style.css" />
	<script src="jquery.js"></script>
</body>
</html>
