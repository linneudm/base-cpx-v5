<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>CDS Pro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ════════════════════════════════════════════
   RESET & TOKENS
════════════════════════════════════════════ */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --c-bg:       #0a0a0f;
  --c-panel:    rgba(12,12,18,0.98);
  --c-s1:       rgba(255,255,255,.055);
  --c-s2:       rgba(255,255,255,.085);
  --c-s3:       rgba(255,255,255,.12);
  --c-b1:       rgba(255,255,255,.08);
  --c-b2:       rgba(255,255,255,.13);
  --c-b3:       rgba(255,255,255,.20);
  --blue:       #2C8FFF;
  --blue-l:     #5AABFF;
  --blue-d:     rgba(44,143,255,.15);
  --blue-g:     rgba(44,143,255,.28);
  --green:      #34D368;
  --green-l:    #5FE38C;
  --green-d:    rgba(52,211,104,.15);
  --green-g:    rgba(52,211,104,.28);
  --red:        #FF5A5A;
  --red-d:      rgba(255,90,90,.15);
  --amber:      #FFB340;
  --text:       #EEEEF0;
  --text2:      rgba(238,238,240,.52);
  --text3:      rgba(238,238,240,.28);
  --text4:      rgba(238,238,240,.16);
  --mono:       'JetBrains Mono',monospace;
  --r-xl:       24px;
  --r-lg:       16px;
  --r-md:       11px;
  --r-sm:       8px;
  --ease-spring:cubic-bezier(.34,1.56,.64,1);
  --ease-out:   cubic-bezier(.22,1,.36,1);
}
html,body{
  width:100vw;height:100vh;overflow:hidden;
  font-family:'Geist',-apple-system,sans-serif;
  background:transparent;color:var(--text);
  -webkit-font-smoothing:antialiased;
}

/* ════════════════════════════════════════════
   CROSSHAIR  (sempre no centro, z alto)
════════════════════════════════════════════ */
#crosshair{
  position:fixed;
  top:50%;left:50%;
  transform:translate(-50%,-50%);
  width:32px;height:32px;
  pointer-events:none;
  z-index:9000;
  opacity:0;
  transition:opacity .25s ease;
}
#crosshair.visible{opacity:1}
#crosshair svg{
  width:100%;height:100%;
  filter:drop-shadow(0 0 5px rgba(44,143,255,.9))
         drop-shadow(0 0 12px rgba(44,143,255,.5));
  animation:chPulse 2.4s ease-in-out infinite;
}
@keyframes chPulse{
  0%,100%{filter:drop-shadow(0 0 4px rgba(44,143,255,.8)) drop-shadow(0 0 10px rgba(44,143,255,.4))}
  50%    {filter:drop-shadow(0 0 7px rgba(44,143,255,1.0)) drop-shadow(0 0 18px rgba(44,143,255,.7))}
}

/* ════════════════════════════════════════════
   HUD BADGE  (canto — modo ativo)
════════════════════════════════════════════ */
#hud{
  position:fixed;bottom:32px;left:50%;
  transform:translateX(-50%) translateY(20px);
  background:rgba(10,10,18,.88);
  border:1px solid var(--c-b2);
  border-radius:40px;
  padding:9px 18px;
  display:flex;align-items:center;gap:9px;
  font-size:12px;font-weight:600;color:var(--text2);
  pointer-events:none;z-index:8999;
  opacity:0;
  box-shadow:0 8px 32px rgba(0,0,0,.5);
  transition:opacity .3s ease, transform .4s var(--ease-spring);
}
#hud.visible{opacity:1;transform:translateX(-50%) translateY(0)}
.hud-dot{
  width:7px;height:7px;border-radius:50%;
  background:var(--green);
  box-shadow:0 0 8px var(--green-g);
  animation:blink 2s ease-in-out infinite;
}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
.hud-key{
  background:var(--c-s3);border:1px solid var(--c-b2);
  border-radius:5px;padding:1px 7px;
  font-size:11px;font-weight:700;color:var(--text);
  font-family:var(--mono);
}

/* ════════════════════════════════════════════
   TOAST
════════════════════════════════════════════ */
#toast{
  position:fixed;top:22px;left:50%;
  transform:translateX(-50%) translateY(-70px);
  background:rgba(14,14,22,.96);
  border:1px solid var(--c-b2);
  border-radius:30px;padding:10px 20px;
  font-size:12.5px;font-weight:600;
  color:var(--text);letter-spacing:-.01em;
  display:flex;align-items:center;gap:8px;
  box-shadow:0 12px 40px rgba(0,0,0,.6);
  pointer-events:none;z-index:9999;white-space:nowrap;
  transition:transform .4s var(--ease-spring), opacity .3s ease;
  opacity:0;
}
#toast.show{transform:translateX(-50%) translateY(0);opacity:1}
#toast .ti{font-size:14px}

/* ════════════════════════════════════════════
   APP OVERLAY
════════════════════════════════════════════ */
#app{
  position:fixed;inset:0;
  display:none;align-items:center;justify-content:flex-end;
  padding-right:28px;
  z-index:1000;
}
#app.show{display:flex}
.veil{
  position:absolute;inset:0;
  background:rgba(0,0,0,.45);
  cursor:pointer;
}

/* ════════════════════════════════════════════
   PANEL
════════════════════════════════════════════ */
.panel{
  position:relative;z-index:2;
  width:480px;
  height:min(90vh, 860px);
  background:var(--c-panel);
  border:1px solid var(--c-b2);
  border-radius:var(--r-xl);
  box-shadow:
    -40px 0 120px rgba(0,0,0,.6),
    0 0 0 .5px rgba(255,255,255,.04) inset,
    inset 0 1px 0 rgba(255,255,255,.08);
  display:flex;flex-direction:column;overflow:hidden;
  transform:translateX(30px) scale(.97);opacity:0;
  transition:transform .45s var(--ease-out), opacity .3s ease;
}
.panel.open{transform:translateX(0) scale(1);opacity:1}

/* ambient glows inside panel */
.panel-glow-top{
  position:absolute;top:-60px;right:-40px;
  width:240px;height:240px;border-radius:50%;
  background:radial-gradient(circle,rgba(44,143,255,.10) 0%,transparent 70%);
  pointer-events:none;
}
.panel-glow-bot{
  position:absolute;bottom:-60px;left:-40px;
  width:200px;height:200px;border-radius:50%;
  background:radial-gradient(circle,rgba(52,211,104,.07) 0%,transparent 70%);
  pointer-events:none;
}

/* ════════════════════════════════════════════
   PANEL HEADER
════════════════════════════════════════════ */
.phdr{
  flex-shrink:0;
  padding:20px 20px 0;
  display:flex;align-items:flex-start;justify-content:space-between;
  gap:12px;
}
.phdr-brand{display:flex;flex-direction:column;gap:3px}
.phdr-tag{
  font-size:9.5px;font-weight:700;letter-spacing:.14em;
  text-transform:uppercase;color:var(--blue);
}
.phdr-title{
  font-size:26px;font-weight:800;color:var(--text);
  letter-spacing:-.04em;line-height:1;
}
.phdr-sub{font-size:11px;color:var(--text3);margin-top:1px}

.phdr-right{display:flex;align-items:center;gap:6px}
.icon-btn{
  width:32px;height:32px;border-radius:50%;
  background:var(--c-s1);border:1px solid var(--c-b1);
  color:var(--text2);font-size:14px;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;transition:all .2s ease;flex-shrink:0;
}
.icon-btn:hover{background:rgba(255,90,90,.15);color:var(--red);border-color:rgba(255,90,90,.3)}

/* ════════════════════════════════════════════
   MODE CARD
════════════════════════════════════════════ */
.mode-card{
  flex-shrink:0;margin:14px 20px 0;
  background:var(--c-s1);border:1px solid var(--c-b1);
  border-radius:var(--r-lg);padding:14px 16px;
  display:flex;align-items:center;justify-content:space-between;
  gap:12px;transition:all .3s ease;
}
.mode-card.on{
  background:rgba(44,143,255,.08);
  border-color:rgba(44,143,255,.25);
  box-shadow:0 0 0 1px rgba(44,143,255,.1) inset;
}
.mode-left{display:flex;align-items:center;gap:12px}
.mode-icon{
  width:38px;height:38px;border-radius:10px;
  background:var(--c-s2);
  display:flex;align-items:center;justify-content:center;
  font-size:18px;flex-shrink:0;transition:all .3s;
}
.mode-card.on .mode-icon{
  background:rgba(44,143,255,.2);
  box-shadow:0 0 16px rgba(44,143,255,.3);
}
.mode-title{font-size:14px;font-weight:700;color:var(--text);letter-spacing:-.02em}
.mode-hint{
  font-size:11px;color:var(--text3);margin-top:2px;
  display:flex;align-items:center;gap:5px;
}
.kbd{
  font-family:var(--mono);font-size:10px;font-weight:700;
  background:var(--c-s2);border:1px solid var(--c-b2);
  border-radius:4px;padding:1px 5px;color:var(--text2);
}

/* iOS Toggle */
.ios-sw{position:relative;width:50px;height:30px;cursor:pointer;flex-shrink:0}
.ios-sw input{position:absolute;opacity:0;width:0;height:0}
.ios-track{
  position:absolute;inset:0;border-radius:15px;
  background:rgba(120,120,128,.32);
  transition:background .28s ease;
}
.ios-sw input:checked ~ .ios-track{
  background:var(--blue);
  box-shadow:0 0 12px var(--blue-g);
}
.ios-thumb{
  position:absolute;top:3px;left:3px;
  width:24px;height:24px;border-radius:50%;
  background:white;
  box-shadow:0 2px 8px rgba(0,0,0,.35),0 1px 2px rgba(0,0,0,.2);
  transition:transform .3s var(--ease-spring);
}
.ios-sw input:checked ~ .ios-track .ios-thumb{transform:translateX(20px)}

/* ════════════════════════════════════════════
   ACTION BUTTONS
════════════════════════════════════════════ */
.actions{
  flex-shrink:0;
  display:flex;gap:8px;padding:10px 20px 0;
}
.act-btn{
  flex:1;height:44px;border-radius:var(--r-lg);border:none;
  font-family:'Geist',sans-serif;font-size:13px;font-weight:700;
  letter-spacing:-.02em;
  cursor:pointer;display:flex;align-items:center;justify-content:center;gap:7px;
  transition:all .2s ease;position:relative;overflow:hidden;
}
.act-btn::before{
  content:'';position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(255,255,255,.12) 0%,transparent 55%);
  pointer-events:none;
}
.act-btn:disabled{opacity:.35;cursor:not-allowed;transform:none!important}
.act-btn:not(:disabled):hover{transform:translateY(-1.5px)}
.act-btn:not(:disabled):active{transform:scale(.97)}

.act-aim{
  background:linear-gradient(140deg,#2C8FFF 0%,#1A5FCC 100%);
  color:#fff;
  box-shadow:0 4px 18px rgba(44,143,255,.35),0 1px 0 rgba(255,255,255,.15) inset;
}
.act-aim:not(:disabled):hover{box-shadow:0 8px 28px rgba(44,143,255,.45)}

.act-ped{
  background:linear-gradient(140deg,#34D368 0%,#1E8840 100%);
  color:#fff;
  box-shadow:0 4px 18px rgba(52,211,104,.35),0 1px 0 rgba(255,255,255,.15) inset;
}
.act-ped:not(:disabled):hover{box-shadow:0 8px 28px rgba(52,211,104,.45)}

.act-del{
  width:44px;flex:none;
  background:var(--c-s1);border:1px solid var(--c-b1);
  color:var(--text2);font-size:16px;
}
.act-del:hover{background:var(--red-d);color:var(--red);border-color:rgba(255,90,90,.28)!important}

/* ════════════════════════════════════════════
   DIVIDER
════════════════════════════════════════════ */
.sep{
  flex-shrink:0;
  height:1px;margin:12px 20px 0;
  background:linear-gradient(90deg,transparent,var(--c-b2) 20%,var(--c-b2) 80%,transparent);
}

/* ════════════════════════════════════════════
   SCROLL AREA
════════════════════════════════════════════ */
.scroll{
  flex:1;overflow-y:auto;
  padding:12px 20px 20px;
  display:flex;flex-direction:column;gap:8px;
  scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.08) transparent;
}
.scroll::-webkit-scrollbar{width:3px}
.scroll::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1);border-radius:2px}

/* ────── Empty state ────── */
.empty{
  flex:1;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:12px;
  padding:48px 0;text-align:center;
  animation:fadeUp .5s var(--ease-out);
}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.empty-ring{
  width:64px;height:64px;border-radius:50%;
  background:var(--c-s1);border:1px solid var(--c-b1);
  display:flex;align-items:center;justify-content:center;
  font-size:26px;
}
.empty-title{font-size:14px;font-weight:700;color:var(--text2);letter-spacing:-.02em}
.empty-body{font-size:11.5px;color:var(--text3);line-height:1.65;max-width:220px}
.empty-body b{color:var(--text2);font-weight:600}

/* ════════════════════════════════════════════
   CAPTURE CARD
════════════════════════════════════════════ */
.card{
  background:var(--c-s1);border:1px solid var(--c-b1);
  border-radius:var(--r-lg);overflow:hidden;flex-shrink:0;
  transition:border-color .2s;
  animation:cardSlide .38s var(--ease-spring);
}
@keyframes cardSlide{
  from{opacity:0;transform:translateY(16px) scale(.96)}
  to  {opacity:1;transform:none}
}
.card:hover{border-color:var(--c-b2)}

/* accent bar on left */
.card.aim{border-left:2.5px solid var(--blue)}
.card.ped{border-left:2.5px solid var(--green)}

/* ── card header ── */
.card-hdr{
  display:flex;align-items:center;justify-content:space-between;
  padding:13px 14px 13px 13px;
  cursor:pointer;user-select:none;gap:8px;
  transition:background .18s;
}
.card-hdr:hover{background:var(--c-s2)}
.card-hdr-l{display:flex;align-items:center;gap:9px;min-width:0;flex:1}

.card-type-dot{
  width:8px;height:8px;border-radius:50%;flex-shrink:0;
  box-shadow:0 0 6px currentColor;
}
.aim .card-type-dot{background:var(--blue);color:var(--blue)}
.ped .card-type-dot{background:var(--green);color:var(--green)}

.card-pill{
  font-size:9px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;
  padding:2px 9px;border-radius:20px;flex-shrink:0;
}
.aim .card-pill{background:var(--blue-d);color:var(--blue-l)}
.ped .card-pill{background:var(--green-d);color:var(--green-l)}

.card-preview{
  font-family:var(--mono);font-size:11.5px;color:var(--text2);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.card-hdr-r{display:flex;align-items:center;gap:8px;flex-shrink:0}
.card-ts{font-size:10px;color:var(--text4);font-variant-numeric:tabular-nums}
.card-chevron{
  font-size:10px;color:var(--text3);
  transition:transform .35s var(--ease-spring);
  line-height:1;
}
.card.open .card-chevron{transform:rotate(180deg)}

/* ── card body ── */
.card-body{
  max-height:0;overflow:hidden;
  transition:max-height .42s cubic-bezier(.4,0,.2,1);
}
.card.open .card-body{max-height:700px}
.card-inner{padding:0 14px 14px;display:flex;flex-direction:column;gap:7px}

/* raw coords strip */
.coord-strip{
  display:grid;grid-template-columns:repeat(4,1fr);gap:6px;
}
.ci{
  background:rgba(0,0,0,.3);border:1px solid var(--c-b1);
  border-radius:var(--r-md);padding:9px 10px;
  display:flex;flex-direction:column;gap:3px;
}
.ci-label{font-size:9px;font-weight:800;letter-spacing:.1em;text-transform:uppercase}
.ci.cx .ci-label{color:rgba(255,100,90,.85)}
.ci.cy .ci-label{color:rgba(52,211,104,.85)}
.ci.cz .ci-label{color:rgba(44,143,255,.85)}
.ci.ch .ci-label{color:rgba(255,179,64,.85)}
.ci-val{font-family:var(--mono);font-size:12px;font-weight:500;color:var(--text)}

/* format grid */
.fmt-grid{display:flex;flex-direction:column;gap:4px}
.fmt-item{
  display:flex;align-items:center;gap:8px;
  background:rgba(0,0,0,.22);border:1px solid var(--c-b1);
  border-radius:var(--r-md);padding:9px 11px;
  cursor:pointer;transition:all .16s ease;
}
.fmt-item:hover{background:rgba(255,255,255,.05);border-color:var(--c-b2)}
.fmt-item:active{transform:scale(.99)}
.fmt-item-l{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.fmt-label{font-size:9px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text4)}
.fmt-val{
  font-family:var(--mono);font-size:11.5px;color:var(--text);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.cp{
  flex-shrink:0;width:28px;height:28px;border-radius:var(--r-sm);
  background:var(--c-s2);border:1px solid var(--c-b1);
  color:var(--text3);font-size:13px;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;transition:all .18s ease;
}
.cp:hover{background:var(--blue-d);color:var(--blue-l);border-color:rgba(44,143,255,.3)}
.cp.ok{background:var(--green-d);color:var(--green-l);border-color:rgba(52,211,104,.3)}

/* card footer btns */
.card-footer{display:flex;gap:5px;margin-top:2px}
.card-foot-btn{
  flex:1;height:32px;border-radius:var(--r-md);border:none;
  font-family:'Geist',sans-serif;font-size:11.5px;font-weight:700;
  cursor:pointer;transition:all .18s;
  display:flex;align-items:center;justify-content:center;gap:5px;
}
.cfb-copy{background:var(--c-s2);border:1px solid var(--c-b1);color:var(--text2)}
.cfb-copy:hover{background:var(--blue-d);color:var(--blue-l);border-color:rgba(44,143,255,.3)}
.cfb-del{background:var(--c-s1);border:1px solid var(--c-b1);color:var(--text3)}
.cfb-del:hover{background:var(--red-d);color:var(--red);border-color:rgba(255,90,90,.28)}

/* ════════════════════════════════════════════
   STATUS BAR
════════════════════════════════════════════ */
.sbar{
  flex-shrink:0;
  padding:10px 20px 16px;
  border-top:1px solid var(--c-b1);
  display:flex;align-items:center;justify-content:space-between;
}
.sbar-l{display:flex;align-items:center;gap:7px;font-size:11.5px;font-weight:600;color:var(--text3)}
.sdot{
  width:6px;height:6px;border-radius:50%;
  background:var(--text4);transition:all .3s;
}
.sdot.on{background:var(--green);box-shadow:0 0 8px var(--green-g);animation:blink 2s infinite}
.sbar-r{font-size:11px;color:var(--text4)}
</style>
</head>
<body>

<!-- ══ CROSSHAIR ════════════════════════════════ -->
<div id="crosshair">
  <svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
    <!-- outer ring -->
    <circle cx="16" cy="16" r="9" stroke="#2C8FFF" stroke-width="1" opacity=".5"/>
    <!-- cross lines -->
    <line x1="16" y1="2"  x2="16" y2="9"  stroke="#2C8FFF" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="16" y1="23" x2="16" y2="30" stroke="#2C8FFF" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="2"  y1="16" x2="9"  y2="16" stroke="#2C8FFF" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="23" y1="16" x2="30" y2="16" stroke="#2C8FFF" stroke-width="1.5" stroke-linecap="round"/>
    <!-- center dot -->
    <circle cx="16" cy="16" r="2" fill="#2C8FFF"/>
  </svg>
</div>

<!-- ══ HUD BADGE ═══════════════════════════════ -->
<div id="hud">
  <div class="hud-dot"></div>
  <span style="color:var(--text)">Modo Captura</span>
  <span class="hud-key">E</span>
  <span style="color:var(--text3);font-size:10px">mira</span>
  <span class="hud-key">F</span>
  <span style="color:var(--text3);font-size:10px">ped</span>
</div>

<!-- ══ TOAST ═══════════════════════════════════ -->
<div id="toast"><span class="ti" id="ti">✓</span><span id="tt">Copiado!</span></div>

<!-- ══ APP ═════════════════════════════════════ -->
<div id="app">
  <div class="veil" onclick="closeUI()"></div>

  <div class="panel" id="panel">
    <div class="panel-glow-top"></div>
    <div class="panel-glow-bot"></div>

    <!-- Header -->
    <div class="phdr">
      <div class="phdr-brand">
        <span class="phdr-tag">Sistema • v5.0</span>
        <span class="phdr-title">CDS Pro</span>
        <span class="phdr-sub">Captura de coordenadas local</span>
      </div>
      <div class="phdr-right">
        <button class="icon-btn" title="Fechar" onclick="closeUI()">✕</button>
      </div>
    </div>

    <!-- Mode toggle -->
    <div class="mode-card" id="mcard">
      <div class="mode-left">
        <div class="mode-icon" id="micon">📍</div>
        <div>
          <div class="mode-title">Modo Captura</div>
          <div class="mode-hint">
            <span class="kbd">E</span> mira &nbsp;
            <span class="kbd">F</span> personagem
          </div>
        </div>
      </div>
      <label class="ios-sw">
        <input type="checkbox" id="sw" onchange="setMode(this.checked)">
        <div class="ios-track"><div class="ios-thumb"></div></div>
      </label>
    </div>

    <!-- Actions -->
    <div class="actions">
      <button class="act-btn act-aim" id="bAim" onclick="doAim()" disabled>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><circle cx="12" cy="12" r="8"/><line x1="12" y1="2" x2="12" y2="6"/><line x1="12" y1="18" x2="12" y2="22"/><line x1="2" y1="12" x2="6" y2="12"/><line x1="18" y1="12" x2="22" y2="12"/><circle cx="12" cy="12" r="2"/></svg>
        Capturar Mira
      </button>
      <button class="act-btn act-ped" id="bPed" onclick="doPed()" disabled>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><circle cx="12" cy="5" r="2"/><line x1="12" y1="9" x2="12" y2="15"/><polyline points="8,22 12,15 16,22"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
        Capturar Ped
      </button>
      <button class="act-btn act-del" title="Limpar tudo" onclick="clearAll()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="3,6 5,6 21,6"/><path d="M19,6l-1,14H6L5,6"/><path d="M10,11v6"/><path d="M14,11v6"/><path d="M9,6V4h6v2"/></svg>
      </button>
    </div>

    <div class="sep"></div>

    <!-- Scroll -->
    <div class="scroll" id="scroll">
      <div class="empty" id="empty">
        <div class="empty-ring">📡</div>
        <div class="empty-title">Nenhuma captura ainda</div>
        <div class="empty-body">
          Ative o modo captura e pressione<br>
          <b>E</b> para mira ou <b>F</b> para personagem.<br>
          Ou use os botões acima.
        </div>
      </div>
    </div>

    <!-- Status bar -->
    <div class="sbar">
      <div class="sbar-l">
        <div class="sdot" id="sdot"></div>
        <span id="stxt">Desativado</span>
      </div>
      <span class="sbar-r" id="scnt">0 capturas</span>
    </div>

  </div><!-- /.panel -->
</div><!-- /#app -->

<script>
/* ════════════════════════════════════════════
   STATE
════════════════════════════════════════════ */
const FMTS = [
  { k:'vector4',    l:'Vector4'     },
  { k:'vector3',    l:'Vector3'     },
  { k:'configXYZH', l:'Config XYZH' },
  { k:'configXYZ',  l:'Config XYZ'  },
  { k:'vec3alt',    l:'Vec3 Alt'    },
  { k:'xyzh',       l:'XYZH'        },
  { k:'xyz',        l:'XYZ'         },
];
let caps    = [];
let modeOn  = false;
let tTid, tTid2;

/* ════════════════════════════════════════════
   NUI MESSAGE BUS
════════════════════════════════════════════ */
window.addEventListener('message', e => {
  const m = e.data;
  if (!m?.type) return;
  switch(m.type){
    case 'toggleUI':    m.visible ? showPanel() : hidePanel(); break;
    case 'setCrosshair': setCrosshair(m.visible); break;
    case 'addCapture':  addCap(m.source, m.data); break;
    case 'captureError': toast('⚠️ Nenhuma superfície detectada', '#FFB340'); break;
  }
});

/* ════════════════════════════════════════════
   CROSSHAIR + HUD
════════════════════════════════════════════ */
function setCrosshair(on){
  document.getElementById('crosshair').classList.toggle('visible', on);
  document.getElementById('hud').classList.toggle('visible', on);
}

/* ════════════════════════════════════════════
   PANEL SHOW / HIDE
════════════════════════════════════════════ */
function showPanel(){
  const a = document.getElementById('app');
  a.style.display = 'flex';
  requestAnimationFrame(()=>requestAnimationFrame(()=>
    document.getElementById('panel').classList.add('open')
  ));
  // hide crosshair while panel open
  setCrosshair(false);
}
function hidePanel(){
  document.getElementById('panel').classList.remove('open');
  setTimeout(()=>{ document.getElementById('app').style.display='none'; }, 380);
  // restore crosshair if mode on
  if(modeOn) setCrosshair(true);
}
function closeUI(){
  hidePanel();
  post('closeUI',{});
}

/* ════════════════════════════════════════════
   MODE TOGGLE
════════════════════════════════════════════ */
function setMode(on){
  modeOn = on;
  document.getElementById('mcard').classList.toggle('on', on);
  document.getElementById('bAim').disabled = !on;
  document.getElementById('bPed').disabled = !on;
  document.getElementById('sdot').classList.toggle('on', on);
  document.getElementById('stxt').textContent = on ? 'Modo captura ativo' : 'Desativado';
  // crosshair only if mode on and panel closed
  const panelOpen = document.getElementById('panel').classList.contains('open');
  setCrosshair(on && !panelOpen);
  post('setCDSMode',{active:on});
}

/* ════════════════════════════════════════════
   CAPTURE ACTIONS
════════════════════════════════════════════ */
function doAim(){ post('captureAim',{}); }
function doPed(){ post('capturePed',{}); }

/* ════════════════════════════════════════════
   ADD CAPTURE + BUILD CARD
════════════════════════════════════════════ */
function addCap(src, data){
  const id  = Date.now();
  const ts  = nowStr();
  caps.unshift({id,src,data,ts});
  updateUI();

  const scroll = document.getElementById('scroll');
  const card   = mkCard({id,src,data,ts});
  scroll.prepend(card);
  requestAnimationFrame(()=>card.classList.add('open'));

  toast(
    src==='aim' ? '⌖  Mira capturada!' : '🧍  Ped capturado!',
    src==='aim' ? '#2C8FFF' : '#34D368'
  );
}

function mkCard({id,src,data,ts}){
  const r  = data.raw||{};
  const el = document.createElement('div');
  el.className = `card ${src}`;
  el.dataset.id = id;

  /* ── header ── */
  const hdr = el.appendChild(document.createElement('div'));
  hdr.className = 'card-hdr';
  hdr.innerHTML = `
    <div class="card-hdr-l">
      <div class="card-type-dot"></div>
      <span class="card-pill">${src==='aim'?'⌖ Mira':'🧍 Ped'}</span>
      <span class="card-preview">${x(data.vector4)}</span>
    </div>
    <div class="card-hdr-r">
      <span class="card-ts">${ts}</span>
      <span class="card-chevron">▾</span>
    </div>`;
  hdr.addEventListener('click', ()=>el.classList.toggle('open'));

  /* ── body ── */
  const body  = el.appendChild(document.createElement('div'));
  body.className = 'card-body';
  const inner = body.appendChild(document.createElement('div'));
  inner.className = 'card-inner';

  /* coord strip */
  const strip = inner.appendChild(document.createElement('div'));
  strip.className = 'coord-strip';
  [['cx','X',r.x],['cy','Y',r.y],['cz','Z',r.z],['ch','H°',r.h]].forEach(([cls,lbl,val])=>{
    strip.innerHTML += `<div class="ci ${cls}">
      <span class="ci-label">${lbl}</span>
      <span class="ci-val">${val}</span>
    </div>`;
  });

  /* formats */
  const grid = inner.appendChild(document.createElement('div'));
  grid.className = 'fmt-grid';
  FMTS.forEach(f=>{
    const v   = data[f.k]??'';
    const row = grid.appendChild(document.createElement('div'));
    row.className = 'fmt-item';
    row.innerHTML = `
      <div class="fmt-item-l">
        <span class="fmt-label">${f.l}</span>
        <span class="fmt-val">${x(v)}</span>
      </div>
      <button class="cp" title="Copiar">⎘</button>`;
    const cpBtn = row.querySelector('.cp');
    const doCopy = ()=>{
      copy(v);
      cpBtn.classList.add('ok'); cpBtn.textContent='✓';
      setTimeout(()=>{cpBtn.classList.remove('ok');cpBtn.textContent='⎘';},1400);
    };
    cpBtn.addEventListener('click', e=>{ e.stopPropagation(); doCopy(); });
    row.addEventListener('click', doCopy);
  });

  /* footer */
  const foot = inner.appendChild(document.createElement('div'));
  foot.className = 'card-footer';

  const cpAll = foot.appendChild(document.createElement('button'));
  cpAll.className = 'card-foot-btn cfb-copy';
  cpAll.innerHTML = '⎘ Copiar Vector4';
  cpAll.addEventListener('click',()=>{ copy(data.vector4); toast('⎘ Vector4 copiado!','#34D368'); });

  const del = foot.appendChild(document.createElement('button'));
  del.className = 'card-foot-btn cfb-del';
  del.innerHTML = '✕ Remover';
  del.addEventListener('click',()=>{
    caps = caps.filter(c=>c.id!==id);
    el.style.cssText='opacity:0;transform:scale(.95);transition:all .25s';
    setTimeout(()=>el.remove(),260);
    updateUI();
  });

  return el;
}

/* ════════════════════════════════════════════
   CLEAR ALL
════════════════════════════════════════════ */
function clearAll(){
  caps=[];
  document.querySelectorAll('.card').forEach(c=>{
    c.style.cssText='opacity:0;transition:opacity .2s';
    setTimeout(()=>c.remove(),200);
  });
  updateUI();
  toast('🗑  Histórico limpo','#FF5A5A');
}

/* ════════════════════════════════════════════
   HELPERS
════════════════════════════════════════════ */
function updateUI(){
  const n = caps.length;
  document.getElementById('empty').style.display = n?'none':'flex';
  document.getElementById('scnt').textContent = n+' captura'+(n!==1?'s':'');
}

function copy(t){
  navigator.clipboard.writeText(t).catch(()=>{
    const a=document.createElement('textarea');
    a.value=t;document.body.appendChild(a);a.select();
    document.execCommand('copy');document.body.removeChild(a);
  });
}

function toast(msg, col){
  const el=document.getElementById('toast');
  document.getElementById('tt').textContent=msg;
  el.style.borderColor=(col||'#fff')+'44';
  el.classList.add('show');
  clearTimeout(tTid);
  tTid=setTimeout(()=>el.classList.remove('show'),2400);
}

function nowStr(){
  return new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
}

function x(s){ return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }

function post(cb, data){
  fetch(`https://${rn()}/${cb}`,{method:'POST',body:JSON.stringify(data)}).catch(()=>{});
}

function rn(){
  return typeof GetParentResourceName==='function'?GetParentResourceName():'cds_pro';
}
</script>
</body>
</html>
